name: HYEOKS Sports Engine Automation

on:
  schedule:
    - cron: '0 19 * * *' # 매일 UTC 19:00 (한국 시간 오전 4시)에 자동 실행
  workflow_dispatch: # 깃허브에서 버튼을 눌러 수동으로 즉시 실행 가능

jobs:
  crawl-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 및 AI 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client requests pandas numpy scikit-learn

      - name: 크롤러 실행 및 머신러닝 예측 엔진 풀가동
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          python crawl_and_update.py
          python predict_engine.py
